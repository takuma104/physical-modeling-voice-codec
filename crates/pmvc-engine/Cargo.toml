[package]
name = "pmvc-engine"
description = "The CHIMERA voice as a Python module: control tracks in, samples out, with state snapshots"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "pmvc_engine"
crate-type = ["cdylib"]

[dependencies]
pmvc-voice = { path = "../pmvc-voice" }
numpy = "0.23"
pyo3 = { version = "0.23", features = ["extension-module"] }
