[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pmvc-engine"
version = "0.1.0"
description = "The CHIMERA voice as a Python module: control tracks in, samples out, with state snapshots"
requires-python = ">=3.13"
dependencies = ["numpy"]

[tool.maturin]
module-name = "pmvc_engine"

# rebuild when the Rust sources change (uv otherwise only watches this file): this crate's, the
# wrapper's it is made of, and the engine's (a fork from V2 on, which changes)
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "../pmvc-voice/src/**/*.rs" },
    { file = "../../third-party/chimera-vocal-synth/crates/chimera/src/**/*.rs" },
]
